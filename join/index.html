<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Join Match | AetherLife</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2b3040;
            --gold: #d4af37;
            --primary: #6366f1;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #1e2235 0%, var(--bg) 70%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 4px 12px;
            margin-bottom: 14px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        p.subtitle {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .pin-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 20px;
        }
        .pin-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 4px;
        }
        .pin-value {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 0.18em;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: transform 0.1s ease, opacity 0.15s ease;
            margin-bottom: 10px;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .store-links {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .store-links .btn {
            margin-bottom: 0;
            font-size: 13px;
            padding: 11px 10px;
        }
        .status-note {
            margin-top: 16px;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>
<body>
<div class="card">
    <div class="badge">AetherLife Multiplayer</div>
    <h1>You're Invited to a Match</h1>
    <p class="subtitle">Opening AetherLife to join your table's lobby…</p>

    <div class="pin-box" id="pinBox" style="display: none;">
        <div class="pin-label">Room PIN</div>
        <div class="pin-value" id="pinValue">------</div>
    </div>

    <a id="openAppBtn" class="btn btn-primary" href="aetherlife://join">Open in AetherLife App</a>
    <button id="copyPinBtn" class="btn btn-secondary" type="button" style="display: none;">Copy Room PIN</button>

    <div class="store-links">
        <a id="playStoreBtn" class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.atrescode.life">Google Play</a>
        <a id="appStoreBtn" class="btn btn-secondary" href="https://apps.apple.com/app/id6745836468">App Store</a>
    </div>

    <p class="status-note" id="statusNote">
        Don't have AetherLife installed yet? We'll take you to the store automatically.
    </p>
</div>

<script>
    (function () {
        function extractPin() {
            var params = new URLSearchParams(window.location.search);
            var qPin = (params.get("pin") || params.get("p") || "").trim();
            if (/^\d{6}$/.test(qPin)) return qPin;

            var pathMatch = window.location.pathname.match(/\/join\/(\d{6})/);
            if (pathMatch && pathMatch[1]) return pathMatch[1];

            var hashMatch = window.location.hash.match(/(\d{6})/);
            if (hashMatch && hashMatch[1]) return hashMatch[1];

            return "";
        }

        var pin = extractPin();
        var ua = navigator.userAgent || "";
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);

        var playStoreUrl = "https://play.google.com/store/apps/details?id=com.atrescode.life" +
            (pin ? "&referrer=" + encodeURIComponent("pin=" + pin) : "");
        var appStoreUrl = "https://apps.apple.com/app/id6745836468";
        var customSchemeUrl = pin ? ("aetherlife://join/" + pin) : "aetherlife://join";

        // Android Chrome intent:// URI automatically opens the app if installed,
        // or falls back to Google Play Store (with install referrer) if not installed.
        var androidIntentUrl = "intent://join" + (pin ? ("/" + pin) : "") +
            "#Intent;scheme=aetherlife;package=com.atrescode.life;" +
            "S.browser_fallback_url=" + encodeURIComponent(playStoreUrl) + ";end";

        var openAppBtn = document.getElementById("openAppBtn");
        var playStoreBtn = document.getElementById("playStoreBtn");
        var appStoreBtn = document.getElementById("appStoreBtn");
        var copyPinBtn = document.getElementById("copyPinBtn");
        var pinBox = document.getElementById("pinBox");
        var pinValue = document.getElementById("pinValue");

        playStoreBtn.href = playStoreUrl;
        appStoreBtn.href = appStoreUrl;
        openAppBtn.href = isAndroid ? androidIntentUrl : customSchemeUrl;

        if (pin) {
            pinBox.style.display = "block";
            pinValue.textContent = pin;
            copyPinBtn.style.display = "block";
            copyPinBtn.addEventListener("click", function () {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(pin).then(function () {
                        copyPinBtn.textContent = "✓ Copied PIN: " + pin;
                    });
                }
            });
        }

        // Automatically attempt to open the app on mobile devices, with store fallback:
        if (isAndroid) {
            window.location.replace(androidIntentUrl);
        } else if (isIOS) {
            window.location.href = customSchemeUrl;
            setTimeout(function () {
                if (!document.hidden) {
                    window.location.href = appStoreUrl;
                }
            }, 1600);
        }
    })();
</script>
</body>
</html>
